# NEXRAD ingest defaults. Concurrency values are intentionally conservative for shared systems.

schema_version: 1

# Level-II chunk source; do not change unless operating a compatible mirror.
buckets:
  chunks: unidata-nexrad-level2-chunks
# Station catalog cache settings.
stations:
  catalog_url: https://api.weather.gov/radar/stations
  api_timeout_seconds: 15
  api_cache_ttl_seconds: 30

# Volume-selection rules calibrated for supported VCPs and elevation products.
selection:
  # Restrict to known scan strategies; adding VCPs needs product validation.
  allowed_vcps: [12, 212, 215]
  high_max_angle_deg: 4.0
  min_sweep_angle_deg: 0.4
  canonical_elevation_bins: [0.5, 0.9, 1.3, 1.8, 2.4, 3.1, 4.0]
  min_required_volume_chunks: 25
  waveforms:
    surveillance: contiguous_surveillance
    doppler: contiguous_doppler
    single_elevation: [staggered_pulse_pair, batch]

# Failure budgets; raise only for known slow networks to avoid stalled cycles.
timeouts:
  volume_discovery_seconds: 20.0
  chunk_list_seconds: 20.0
  ingest_seconds: 120.0
  scan_seconds: 180.0
  cancellation_grace_seconds: 2.0
  heartbeat_stale_seconds: 240.0
  heartbeat_startup_grace_seconds: 60.0

# Resource caps; increase gradually and monitor S3, CPU, and memory pressure.
concurrency:
  max_site_tasks: 24
  max_chunk_downloads: 64
  worker_pool_size: 4
  worker_recycle_interval: 24
  worker_timeout_seconds: 40.0
  parse_checkpoint_chunk_interval: 8
  in_volume_prefetch: 4


# Polling cadence; shorter intervals increase remote and local load.
realtime:
  scan_interval_seconds: 20
  completion_interval_seconds: 10
  max_candidate_volumes_per_site: 3

# Null uses runtime arguments/defaults; set only for a fixed service deployment.
cli:
  sites: null
  base_dir: null


# Small retention bounds disk growth while retaining enough scans for consumers.
retention:
  scan_dirs_to_keep: 3
  elevation_dirs_to_keep: 2
  stale_manifest_max_age_hours: 12

# NEXRAD-owned render cadence and retention.
gui:
  retention_minutes: 120
  poll_interval_seconds: 30.0
  poll_interval_min_seconds: 1.0
  max_workers: 8
  cleanup_max_age_minutes: 120
