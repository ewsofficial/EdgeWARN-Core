# API defaults. Change security policy and artifact limits only with a deployment-specific review.

schema_version: 1

server:
  # Listen address; use a reverse proxy rather than exposing an unprotected service.
  host: 0.0.0.0
  port: 5000
  debug_port: 3001
  request_timeout_ms: 30000
  service_stale_after_seconds: 30
  openapi_spec: <src_dir>/api/openapi/v3.yaml
  production_version_label: '2.x'

  v3_api_version: '3.0.0'

security:
  # One year; do not lower for production HTTPS deployments.
  hsts_max_age_seconds: 31536000
  # Use ["*"] to allow any origin. Keep empty to deny all cross-origin requests.
  allowed_origins: ["*"]

  # Leave false unless the deployment has a known, trusted proxy topology.
  trust_proxy: false

  cors:
    methods: [GET, HEAD, OPTIONS]
    allowed_headers: [Content-Type, X-Request-Id]
    max_age: 600
    # Keep false; enabling credentialed cross-origin requests requires code and policy changes.
    credentials: false

  csp_default_src: "'self'"
  compression_skip_media: image/*

logging:
  access_log_enabled: true

rate_limits:
  # Set max to 0 only to intentionally disable this limiter.
  per_second: {max: 100, window_ms: 1000}
  per_minute: {max: 6000, window_ms: 60000}
  standard_headers: true
  legacy_headers: false

artifacts:
  # Safety limits for untrusted artifacts; raise only after memory and abuse review.
  size_limits_bytes: {json: 8388608, binary: 134217728, image: 33554432}
  json_cache: {max_entries: 256, max_size_bytes: 33554432}
  list_limit: 1000

  chunk_length_slack_bytes: 1024

pagination:
  default_limit: 100
  max_limit: 1000

cache_control_max_age:
  collection: 5
  resource: 60
  asset: 31536000

query:
  allowed_params: [cursor, limit]
  max_value_length: 256
  limit_pattern: '^(?:[1-9][0-9]{0,2}|1000)$'

render_defaults:
  grid: {rows: 10, cols: 20, tile_size: 350}

  # Hard safety ceiling for artifact metadata; keep aligned with renderer capabilities.
  grid_maxima: {rows: 100, cols: 100, tile_size: 4096}

validation:
  radar_products: [DBZH, VRADH, WRADH, PHIDP, CCORH, RHOHV, ZDR]

product_catalog:
  entries: 31
