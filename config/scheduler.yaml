# MRMS polling defaults. Increasing lookup depth raises S3 listing cost and cycle latency.

schema_version: 1

scheduler:
  # Per-product listing depth; raise only when normal latency causes missed data.
  modifier_lookup_max_entries: 20

  # Fallback window when no cursor exists; larger windows cost more listings.
  # Must not exceed raw-input retention (runtime.ingest.retention_minutes, else
  # ingest.mrms.cleanup_max_age_minutes); validation rejects a longer window.
  s3_lookback_hours: 1

  # Diagnostic threshold only; it does not change scheduling behavior.
  slow_check_log_threshold_ms: 2000

  # Independent discovery cadence in seconds (1..300).
  ingest_poll_seconds: 10
