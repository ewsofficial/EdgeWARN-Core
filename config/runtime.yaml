# Service runtime defaults. Prefer supported CLI flags and environment variables for deployments.

schema_version: 1

# Request metadata sent to upstream weather services.
identity:
  contact: ewsbackend@gmail.com

  weather_api_accept: application/geo+json

# Feature defaults; use CLI flags for one-off runs instead of editing this file.
run:
  # Default processing region. Narrowing bounds reduces ingest and processing cost.
  lat_limits: [20, 55]
  lon_limits: [230, 300]

  profile: false
  disable_ctam: false
  disable_stormprob: false
  disable_tracking: false
  disable_polygon_expansion: false

  ctam_module_dir: ctam_modules

  disable_ewmrs: false
  disable_nws: false
  disable_metar: false
  disable_wpc: false
  disable_goes: false
  disable_nexrad: false
  mrms_core_only: false

# GOES handoff timing. Values are coupled; avoid shortening waits without observing missed renders.
goes_coordination:
  poll_seconds: 60
  render_wait_seconds: 30
  render_wait_interval_seconds: 1.0
  render_max_offset_minutes: 20.0
  # Leave false unless diagnosing resource contention; it can delay ingest.
  pause_ingest_during_render: false

  render_pause_poll_seconds: 1.0
  render_pause_poll_interval_seconds: 0.2
  poll_interval_seconds: 1.0

  render_wait_interval_floor_seconds: 0.1
  render_wait_poll_granularity_seconds: 0.2

  render_task_max_entries: 10

# Accessory process supervision. Backoff values prevent restart storms.
supervisor:
  check_ticks: 30
  tick_seconds: 0.5
  max_restarts: 5
  restart_window_seconds: 60.0
  base_backoff_seconds: 1.0
  max_backoff_seconds: 30.0

  stop_join_timeout_seconds: 5
  stop_kill_join_timeout_seconds: 1


  health_file: {dir: DATA_DIR, name: runtime/accessory_health.json}
  nexrad_heartbeat_file: {dir: DATA_DIR, name: runtime/nexrad_ingest_heartbeat.json}

# Background-loop cadence; shorter intervals increase CPU and upstream request load.
background_intervals:
  metar_boundary_minutes: 5
  boundary_wait_interval_seconds: 1.0
  nws_seconds: 120
  nws_interval_seconds: 1.0
  wpc_boundary_minutes: 15
  nexrad_seconds: 5
  nexrad_interval_seconds: 0.2
  ewmrs_consumer_seconds: 10
  ewmrs_consumer_interval_seconds: 1.0

# Durable primary-cycle state. Retry settings control recovery from transient ingest failures.
cycle:
  state_file: {dir: DATA_DIR, name: runtime/cycle_state.json}

  retry:
    max_attempts: 3
    initial_backoff_seconds: 5.0
    max_backoff_seconds: 30.0

  # Shared listing depth; raising it increases remote listing work across a cycle.
  ingest_max_entries: 10

  log_drain_poll_seconds: 1

  max_backlog_cycles: 10

# Primary/NEXRAD coordination; leave pauses disabled unless host contention is confirmed.
nexrad_coordination:
  pause_ingest_during_primary_activity: false
  primary_lease_ttl_seconds: 90.0
  pause_max_wait_seconds: 30.0
  pause_poll_interval_seconds: 0.5

# Set false only when intentionally running components independently.
handoff:
  enabled: true

# Optional profiler path; null disables profiling overhead.
profiling:
  perf_tracker: null
