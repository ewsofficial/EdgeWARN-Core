# Service runtime defaults. Prefer supported CLI flags and environment variables for deployments.

schema_version: 1

# Request metadata sent to upstream weather services.
identity:
  contact: ewsbackend@gmail.com

  weather_api_accept: application/geo+json

# Feature defaults; use CLI flags for one-off runs instead of editing this file.
run:
  # Default processing region. Narrowing bounds reduces ingest and processing cost.
  lat_limits: [20, 55]
  lon_limits: [230, 300]

  profile: false
  disable_ctam: false
  disable_stormprob: false
  disable_tracking: false
  disable_polygon_expansion: false

  ctam_module_dir: ctam_modules

  disable_ewmrs: false
  disable_nws: false
  disable_metar: false
  disable_wpc: false
  disable_goes: false
  disable_nexrad: false
  mrms_core_only: false

# GOES handoff timing. Values are coupled; avoid shortening waits without observing missed renders.
goes_coordination:
  poll_seconds: 60
  render_wait_seconds: 30
  render_wait_interval_seconds: 1.0
  render_max_offset_minutes: 20.0
  # Leave false unless diagnosing resource contention; it can delay ingest.
  pause_ingest_during_render: false

  render_pause_poll_seconds: 1.0
  render_pause_poll_interval_seconds: 0.2
  poll_interval_seconds: 1.0

  render_wait_interval_floor_seconds: 0.1
  render_wait_poll_granularity_seconds: 0.2

  render_task_max_entries: 10

# Accessory process supervision. Backoff values prevent restart storms.
supervisor:
  check_ticks: 30
  tick_seconds: 0.5
  max_restarts: 5
  restart_window_seconds: 60.0
  base_backoff_seconds: 1.0
  max_backoff_seconds: 30.0

  stop_join_timeout_seconds: 5
  stop_kill_join_timeout_seconds: 1


  health_file: {dir: DATA_DIR, name: runtime/accessory_health.json}
  nexrad_heartbeat_file: {dir: DATA_DIR, name: runtime/nexrad_ingest_heartbeat.json}

# Background-loop cadence; shorter intervals increase CPU and upstream request load.
background_intervals:
  metar_boundary_minutes: 5
  boundary_wait_interval_seconds: 1.0
  nws_seconds: 120
  nws_interval_seconds: 1.0
  wpc_boundary_minutes: 15
  nexrad_seconds: 5
  nexrad_interval_seconds: 0.2
  ewmrs_consumer_seconds: 10
  ewmrs_consumer_interval_seconds: 1.0

# Durable primary-cycle state. Retry settings control recovery from transient ingest failures.
cycle:
  state_file: {dir: DATA_DIR, name: runtime/cycle_state.json}

  retry:
    max_attempts: 3
    initial_backoff_seconds: 5.0
    max_backoff_seconds: 30.0

  # Shared listing depth; raising it increases remote listing work across a cycle.
  ingest_max_entries: 10

  log_drain_poll_seconds: 1

  max_backlog_cycles: 10

# Primary/NEXRAD coordination; leave pauses disabled unless host contention is confirmed.
nexrad_coordination:
  pause_ingest_during_primary_activity: false
  primary_lease_ttl_seconds: 90.0
  pause_max_wait_seconds: 30.0
  pause_poll_interval_seconds: 0.5

# Set false only when intentionally running components independently.
handoff:
  enabled: true

# Optional profiler path; null disables profiling overhead.
profiling:
  perf_tracker: null

# Independent ingest foundations; consumed by the later service cutover.
ingest:
  # Concurrent listing jobs; null inherits ingest.mrms.downloads.max_concurrency. Bound: 1..64.
  listing_concurrency: null
  # Concurrent MRMS transfers; null inherits ingest.mrms.downloads.max_concurrency. Bound: 1..64.
  download_concurrency: null
  # Concurrent blocking decode workers, capped by download concurrency. Bound: 1..16.
  decode_concurrency: 2
  # Separate RAP/GLM worker slots, one for each source by default. Bound: 1..8.
  auxiliary_concurrency: 2
  # Listing timeout in seconds; null inherits MRMS HTTPS timeout. Bound: 1..600.
  listing_timeout_seconds: null
  # MRMS job timeout in seconds; null inherits four MRMS HTTPS timeouts. Bound: 1..3600.
  download_timeout_seconds: null
  # RAP/GLM job timeout in seconds; null inherits four RAP NOMADS timeouts. Bound: 1..7200.
  auxiliary_timeout_seconds: null
  # S3 objects per page; follows every page within explicit limits. Bound: 1..1000.
  listing_page_size: 1000
  # Maximum pages per product refresh; overflow is an explicit error. Bound: 1..10000.
  listing_max_pages: 100
  # Maximum eligible objects per product refresh; overflow is an explicit error. Bound: 1..100000.
  listing_max_objects: 4096
  # Maximum queued acquisition jobs; overflow applies backpressure. Bound: 1..100000.
  pending_max_jobs: 4096
  # Maximum acquisition attempts per object, matching cycle retry default. Bound: 1..100.
  retry_max_attempts: 3
  # Initial retry delay in seconds, matching cycle retry default. Bound: 1..300.
  retry_initial_seconds: 5
  # Maximum retry delay in seconds, matching cycle retry default. Bound: 1..3600.
  retry_max_seconds: 30
  # Incomplete scan deadline in seconds; covers MRMS alignment window. Bound: 1..3600.
  scan_deadline_seconds: 180
  # Reconciliation cadence in seconds, matching discovery default. Bound: 1..3600.
  reconcile_interval_seconds: 10
  # Unpinned MRMS retention in minutes; null inherits MRMS cleanup age. Bound: 1..10080.
  retention_minutes: null
  # Raw inventory disk budget in MiB; active pins must never be deleted. Bound: 64..1048576.
  disk_budget_mb: 8192
  # Owned-worker termination bound in seconds. Bound: 1..600.
  shutdown_timeout_seconds: 30

# Independent ingest foundations; consumed by the later service cutover.
consumers:
  # Core local readiness check interval in seconds. Bound: 0.1..1.0.
  core_readiness_seconds: 1.0
  # EWMRS input notification check interval in seconds. Bound: 0.1..1.0.
  ewmrs_notification_seconds: 1.0
