# Detection defaults. Tune thresholds only against representative historical cases.

schema_version: 1

detection:
  # Primary detection threshold (dBZ). Tune only with labeled historical validation.
  refl_threshold: 37.5
  # Minimum seeded-area fraction; very small values admit noisy detections.
  min_seed_percentage: 0.001
  # Coupled with gatemapper thresholds; do not tune independently.
  drop_offset: 10.0
  stormcell_cleanup_max_age_minutes: 120
  fallback_dt_seconds: 120.0

  tracking_disabled_defaults:
    tracking_mode: active
    prediction_count: 0
    event_type: active

  # Three matches the input count; increasing it normally adds contention only.
  dataset_load_max_workers: 3

tracker:
  # Weak-cell threshold; confidence behavior is coupled to the two values below.
  decay_max_refl_dbz: 30.0
  decay_confidence_factor: 0.85
  decay_confidence_floor: 0.3

gatemapper:
  # Keep at or below refl_threshold; it caps the baseline mask threshold.
  baseline_refl_floor: 37.5

  # Coupled threshold curve; change all terms together and validate detections.
  dynamic_min_threshold:
    switch_max_refl: 45.0
    low: 37.5
    high: 40.0

  max_refl_clamp: 52.0

  crop_pad_px: 2

  reject_clusters_at_or_below_gates: 5
  # Geometry-size tradeoff; lower values increase output size and CPU cost.
  contour_downsample: 8

  contour_downsample_adaptive:
    keep_all_below_points: 8
    coarse_below_points: 24
    keep_all_step: 1
    coarse_step: 4

  contour_level: 0.5
  coordinate_decimals: 3

morphology:
  min_pixels_full_analysis: 25

  min_contour_points_for_defects: 10

# Only listed NWS event names can be attached to cells.
alert_matching:
  events:
    - Tornado Warning
    - Severe Thunderstorm Warning
    - Tornado Watch
    - Severe Thunderstorm Watch
    - Special Weather Statement
    - Severe Weather Statement
    - Flash Flood Warning

  # Small geometric tolerance; large values cause false alert associations.
  polygon_match_buffer_deg: 0.005
  point_match_buffer_deg: 0.01

  # Bounded caches prevent long historical replays from growing without limit.
  # Reject stale upstream alert snapshots, even when ingest liveness is fresh.
  snapshot_max_age_seconds: 600
  snapshot_cache_max_entries: 8
  geometry_cache_max_entries: 512

save:
  # Output precision; changing it alters the serialized API contract.
  polygon_decimals: 3
  centroid_decimals: 3

hail:
  contour_sampling_step: 5
  # MRMS precipitation-type class used for hail contours; do not change without data semantics review.
  preciptype_class: 6

  contour_level: 0.5
