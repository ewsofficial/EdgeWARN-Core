# Renderer contract. Layer names, wire format, and storage paths must match producers and clients.

schema_version: 1

tiles:
  # Default tile edge length. Keep synchronized with API render defaults.
  tile_size: 700

# On-disk/client wire contract; change only with coordinated producer and client updates.
chunk_format:
  wire_version: 2
  format_version: 2
  encoding: float16
  data_type: float16
  channels: 1
  value_kind: scalar
  no_data: nan
  file_suffix: .f16.gz
  compression: gzip
  media_type: application/octet-stream
  bytes_per_component: 2
  pixel_row_order: top_to_bottom
  grid_origin: bottom_left
# Required layer catalog. Each source and output directory must exist in ingest configuration.
mrms_layers:
  - {name: MRMS_MergedReflectivityQC,         colormap_key: NWS_Reflectivity, filepath: MRMS_COMPOSITE_DIR,   outdir: GUI_COMPOSITE_DIR,   required: true}
  - {name: MRMS_EchoTop18,                    colormap_key: EnhancedEchoTop,  filepath: MRMS_ECHOTOP18_DIR,   outdir: GUI_ECHOTOP18_DIR,   required: true}
  - {name: MRMS_EchoTop30,                    colormap_key: EnhancedEchoTop,  filepath: MRMS_ECHOTOP30_DIR,   outdir: GUI_ECHOTOP30_DIR,   required: true}
  - {name: MRMS_ReflectivityAtLowestAltitude, colormap_key: NWS_Reflectivity, filepath: MRMS_RALA_DIR,        outdir: GUI_RALA_DIR,        required: true}
  - {name: MRMS_ReflectivityAt0C,             colormap_key: NWS_Reflectivity, filepath: MRMS_REF_0C_DIR,      outdir: GUI_REF_0C_DIR,      required: true}
  - {name: MRMS_ReflectivityAtM5C,            colormap_key: NWS_Reflectivity, filepath: MRMS_REFM5C_DIR,      outdir: GUI_REFM5C_DIR,      required: true}
  - {name: MRMS_ReflectivityAtM15C,           colormap_key: NWS_Reflectivity, filepath: MRMS_REFM15C_DIR,     outdir: GUI_REFM15C_DIR,     required: true}
  - {name: MRMS_PrecipRate,                   colormap_key: PrecipRate,       filepath: MRMS_PRECIPRATE_DIR,  outdir: GUI_PRECIPRATE_DIR,  required: true}
  - {name: MRMS_VILDensity,                   colormap_key: VILDensity,       filepath: MRMS_DVIL_DIR,        outdir: GUI_VILD_DIR,        required: true}
  - {name: MRMS_QPE,                          colormap_key: QPE_01H,          filepath: MRMS_QPE_DIR,         outdir: GUI_QPE_DIR,         required: true}
  - {name: MRMS_VIL,                          colormap_key: VIL,              filepath: MRMS_VIL_DIR,         outdir: GUI_VIL_DIR,         required: true}
  - {name: MRMS_VII,                          colormap_key: VIL,              filepath: MRMS_VII_DIR,         outdir: GUI_VII_DIR,         required: true}
  - {name: MRMS_MergedAzShear_0-2kmAGL,       colormap_key: AzShear,          filepath: MRMS_AZSHEARLOW_DIR,  outdir: GUI_AZSHEARLOW_DIR,  required: true}
  - {name: MRMS_MergedAzShear_3-6kmAGL,       colormap_key: AzShear,          filepath: MRMS_AZSHEARMID_DIR,  outdir: GUI_AZSHEARMID_DIR,  required: true}
  - {name: MRMS_MESH,                         colormap_key: MESH,             filepath: MRMS_MESH_DIR,        outdir: GUI_MESH_DIR,        required: true}
  - {name: MRMS_NLDN_CG_005min_AvgDensity,       colormap_key: VILDensity,       filepath: MRMS_NLDN_DIR,        outdir: GUI_NLDN_DIR,        required: true}

# GOES layer catalog. Channel IDs and physical transforms must match ABI metadata.
goes_layers:
  common:
    source_type: goes_abi
    variable_name: CMI
    fallback_variable_names: [Rad]
    required: false
  layers:
    - name: GOES_ABI_C01_Reflectance
      channel_id: C01
      colormap_key: GOES_RGB_Raw
      value_transform: reflectance_from_rad
      filepath: GOES_ABI_VISIBLE_BLUE_DIR
      outdir: GUI_GOES_C01_DIR
      mask_min: {C01: 0.0}
      mask_max: {C01: 1.2}
    - name: GOES_ABI_C02_Reflectance
      channel_id: C02
      colormap_key: GOES_RGB_Raw
      value_transform: reflectance_from_rad
      filepath: GOES_ABI_VISIBLE_RED_DIR
      outdir: GUI_GOES_C02_DIR
      mask_min: {C02: 0.0}
      mask_max: {C02: 1.2}
    - name: GOES_ABI_C03_Reflectance
