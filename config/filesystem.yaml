# Runtime filesystem defaults. Prefer CLI or environment overrides over editing shared paths.

schema_version: 1

# Default runtime location. Override per deployment instead of committing local paths.
base_dir:
  posix: ~/EdgeWARN_input
  windows: 'C:\\EdgeWARN_input'

# Fallback retention only; product-specific retention should take precedence.
cleanup_defaults:
  max_age_minutes: 60
  max_files: 10
