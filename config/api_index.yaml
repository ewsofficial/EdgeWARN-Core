# API index lifecycle defaults for realtime and historical runs.

schema_version: 1

api_index:
  # Realtime cleanup is recommended; historical runs retain cells for reproducibility.
  remove_old_cells:
    realtime: true
    historical: false

  initialize_at_startup:
    realtime: true
    historical: false

  # Keep aligned with storm-cell retention unless historical behavior is intentionally different.
  inactive_cell_max_age_minutes: 120

  # Prune StormProb history sooner than compatibility cell files.
  stormprob_inactive_cell_max_age_minutes: 20
