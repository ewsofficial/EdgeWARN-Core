# RAP ingest defaults. Filename patterns must remain synchronized with NOAA S3 naming.

schema_version: 1

# RAP source, naming, and retention settings. Keep templates and regex synchronized.
rap:
  bucket: noaa-rap-pds
  file_pattern: 'rap.t{hour:02d}z.awp130pgrbf00.grib2'
  dir_pattern: 'rap.{date}'
  nomads_base_url: 'https://nomads.ncep.noaa.gov/pub/data/nccf/com/rap/prod'
  nomads_timeout_seconds: 120
  nomads_chunk_size_bytes: 1048576
  local_file_pattern: 'RAP.{date}-{hour:02d}z.awp130pgrbf00.grib2'
  date_format: '%Y%m%d'
  filename_regex: '^RAP\.(?P<date>\d{8})-(?P<hour>\d{2})z\.awp130pgrbf00\.grib2$'
  # Maximum accepted analysis age; larger values trade freshness for availability.
  max_age_minutes: 180
  lookback_step_hours: 1
  # Local retention cap; keep enough analyses for fallback without growing disk use.
  max_files: 3
