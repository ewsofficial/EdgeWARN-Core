schema_version = 1
id = "cellstats"
name = "CellStats"
version = "1.0.0"
api_version = "1"
enabled = true
required = false
scope = "stormcells"
entrypoint = ["{python}", "main.py"]
# The 10-second default, not the plan example's 30: one 30-second module consumes
# the entire external-module budget. See docs/ctam/internal-api-limits.md.
timeout_seconds = 10
after = ["stormprob"]

[[requires]]
selector = "stormcells.current"
required = true

[[requires]]
selector = "cells.history"
required = true
min_history_entries = 2

[[requires]]
selector = "input:MRMS:MergedReflectivityQCComposite_00.50:current"
required = false
max_age_seconds = 180

[[writes]]
resource = "stormcells.current"
json_pointer = "/features/*/modules/CellStats"

[[writes]]
resource = "cells.history"
json_pointer = "/*/modules/CellStats"

[[writes]]
resource = "stormcells.current"
json_pointer = "/features/*/properties/cellstats_severity"
