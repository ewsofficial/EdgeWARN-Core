[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgewarn-core"
version = "3.0.0"
description = "Backend services and analysis pipeline for EdgeWARN"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = ["meteorology", "weather", "radar", "nowcasting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ewsofficial/EdgeWARN-Core"
Repository = "https://github.com/ewsofficial/EdgeWARN-Core"

[project.scripts]
edgewarn = "edgewarn_cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
py-modules = [
  "process_historical",
  "run",
  "run_all",
  "run_edgewarn",
  "run_ewmrs",
  "run_nexrad",
]

[tool.setuptools.packages.find]
where = ["src"]
include = [
  "EdgeWARN*",
  "EWMRS*",
  "NEXRAD*",
  "common*",
  "edgewarn_cli*",
  "util*",
]
namespaces = true

[tool.setuptools.package-data]
EWMRS = ["*.json"]
