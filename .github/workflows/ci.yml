name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  node-api-contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate config files
        run: npm run validate-config

      - name: Run Node.js contracts with coverage
        run: |
          mkdir -p reports
          npm run test:coverage -- --runInBand --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary --json --outputFile=reports/jest-results.json

      - name: Publish Node coverage and results
        uses: actions/upload-artifact@v4
        with:
          name: node-api-reports
          path: |
            coverage/
            reports/jest-results.json

  python-fast-correctness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: EdgeWARN
          environment-file: environment.yml
          python-version: '3.13'

      - name: Verify native scientific imports
        shell: bash -el {0}
        run: python -c "import netCDF4, pyproj, rasterio"

      - name: Collect offline correctness suite
        shell: bash -el {0}
        run: python -m pytest --collect-only

      - name: Validate config files
        shell: bash -el {0}
        run: PYTHONPATH=src python -m common.config.validate

      - name: Run fast offline correctness with coverage
        shell: bash -el {0}
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p reports
          python -m pytest -m "not integration and not process" \
            --junitxml=reports/python-fast.xml \
            --cov --cov-report=term --cov-report=xml --cov-report=html:reports/python-coverage-html \
            --cov-fail-under=60 -o faulthandler_timeout=120
        timeout-minutes: 25

      - name: Publish Python coverage and results
        uses: actions/upload-artifact@v4
        with:
          name: python-fast-reports
          path: reports/

  python-connected-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: EdgeWARN
          environment-file: environment.yml
          python-version: '3.13'
      - name: Run connected integration lane
        shell: bash -el {0}
        run: python -m pytest -m "integration and not process" --junitxml=python-integration.xml -o faulthandler_timeout=120
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        with:
          name: python-integration-results
          path: python-integration.xml

  python-process-restart:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: EdgeWARN
          environment-file: environment.yml
          python-version: '3.13'
      - name: Run process, restart, and signal lane
        shell: bash -el {0}
        run: python -m pytest -m process --junitxml=python-process.xml -o faulthandler_timeout=120
        timeout-minutes: 20
      - uses: actions/upload-artifact@v4
        with:
          name: python-process-results
          path: python-process.xml

  build-wheel:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: EdgeWARN
          environment-file: environment.yml
          python-version: '3.13'
      - name: Build wheel once
        shell: bash -el {0}
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: edgewarn-wheel
          path: dist/*.whl
          if-no-files-found: error

  package-command:
    needs: build-wheel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup isolated package environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          activate-environment: EdgeWARN
          environment-file: environment.yml
          python-version: '3.13'

      - name: Download exact built wheel
        uses: actions/download-artifact@v4
        with:
          name: edgewarn-wheel
          path: dist

      - name: Install built wheel
        shell: bash -el {0}
        run: |
          wheel_path="$(find "${GITHUB_WORKSPACE}/dist" -maxdepth 1 -name 'edgewarn_core-*.whl' -print -quit)"
          test -n "${wheel_path}"
          echo "EDGEWARN_TEST_WHEEL=${wheel_path}" >> "${GITHUB_ENV}"
          python -m pip install --no-deps --force-reinstall "${wheel_path}"

      - name: Smoke test installed command outside checkout
        shell: bash -el {0}
        run: |
          smoke_dir="${RUNNER_TEMP}/edgewarn-package-smoke"
          cp -R "${GITHUB_WORKSPACE}/config" "${smoke_dir}"
          cd "${RUNNER_TEMP}"
          edgewarn --help
           test "$(edgewarn --version)" = "edgewarn 3.0.0"
          edgewarn configure --config-path "${smoke_dir}" \
            runtime.run.disable_nexrad true

      - name: Run installed-command and supervisor tests
        shell: bash -el {0}
        run: |
          python -m pytest \
            tests/integration/test_installed_command.py \
            tests/unit/test_package_run.py \
            tests/unit/test_run_all_launcher.py
