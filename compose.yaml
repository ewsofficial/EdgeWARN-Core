services:
  edgewarn:
    build:
      context: .
    image: edgewarn-core:3.0.2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "util.runtime.healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3
    # Start ingest before Core and NEXRAD using the package topology.
    command: ["edgewarn", "run", "--config-path", "/etc/edgewarn/config"]
    environment:
      # Set EDGEWARN_HOST_BASE_DIR to choose the host directory.  The package
      # receives the mounted container path through its supported environment
      # contract, so every supervised worker uses the same runtime root.
      EDGEWARN_BASE_DIR: /var/lib/edgewarn
      EDGEWARN_CONFIG_DIR: /etc/edgewarn/config
      # Operator-owned CTAM modules.  Resolution precedence is CLI flag >
      # this variable > runtime.yaml run.ctam_module_dir; the absolute path
      # here skips the relative-path repo-root guessing entirely.
      EDGEWARN_CTAM_MODULE_DIR: /opt/edgewarn/ctam_modules
    volumes:
      - ${EDGEWARN_HOST_BASE_DIR:-./EdgeWARN_input}:/var/lib/edgewarn
      - ./config:/etc/edgewarn/config:ro
      - ${EDGEWARN_LOG_DIR:-./EdgeWARN_logs}:/var/log/edgewarn
      # CTAM modules are operator-supplied code, never baked into the image.
      # Mounted read-only: modules may only mutate data through the loopback
      # CTAM API, never by writing the filesystem.  An absent host directory
      # is a supported empty-module configuration.
      - ${EDGEWARN_CTAM_MODULES_DIR:-./ctam_modules}:/opt/edgewarn/ctam_modules:ro
    stop_grace_period: 25s

  edgewarn-configure:
    image: edgewarn-core:3.0.2
    profiles: ["admin"]
    entrypoint: ["edgewarn"]
    command: ["configure", "--config-path", "/etc/edgewarn/config"]
    stdin_open: true
    tty: true
    volumes:
      - ./config:/etc/edgewarn/config:rw

