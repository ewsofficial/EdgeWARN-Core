[pytest]
# Python path
pythonpath = src

# Asyncio
asyncio_mode = auto

# Test discovery
testpaths =
    tests/core
    tests/architecture
    tests/integration
    tests/packaging
    tests/unit
    tests/util
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add options
addopts = 
    -v
    --tb=short
    --strict-markers
    --ignore=tests/api
    --ignore=benchmarks

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use external resources)
    e2e: End-to-end tests (full system)
    slow: Slow tests (> 1 second)
    api: API-related tests
    ingest: Data ingestion tests
    process: Data processing tests
    ctam: CTAM module tests
    benchmark: Opt-in performance measurement
    network: Opt-in live external-service compatibility probe

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
